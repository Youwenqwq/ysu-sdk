[project]
name = "ysu-sdk"
version = "0.6.0"
description = "燕山大学统一身份认证与教务系统信息查询 SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pycryptodome>=3.20",
    "beautifulsoup4>=4.12",
]

[tool.hatch.build.targets.wheel]
packages = ["ysu_sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
